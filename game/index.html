<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunbreak: Coastline</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141820;
  }
  #game, #hud {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }
  #game { z-index: 1; cursor: crosshair; }
  #hud { z-index: 2; pointer-events: none; }
  /* Announced to screen readers, never shown. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
<link rel="modulepreload" href="./src/main.js">
<link rel="modulepreload" href="./src/config.js">
<link rel="modulepreload" href="./src/random.js">
<link rel="modulepreload" href="./src/city.js">
<link rel="modulepreload" href="./src/player.js">
<link rel="modulepreload" href="./src/vehicles.js">
<link rel="modulepreload" href="./src/traffic.js">
<link rel="modulepreload" href="./src/police.js">
<link rel="modulepreload" href="./src/combat.js">
<link rel="modulepreload" href="./src/missions.js">
<link rel="modulepreload" href="./src/audio.js">
<link rel="modulepreload" href="./src/save.js">
<link rel="modulepreload" href="./src/input.js">
<link rel="modulepreload" href="./src/render.js">
<link rel="modulepreload" href="./src/hud.js">
<link rel="modulepreload" href="./src/shots.js">
</head>
<body>
<noscript><p style="color:#f0e4c8;font-family:sans-serif;padding:2rem">Sunbreak: Coastline needs JavaScript enabled to play.</p></noscript>
<canvas id="game" aria-label="Sunbreak: Coastline, an original open-world crime game. Move with WASD, steal cars with E, punch with Space, shoot with F or the mouse."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
